name: Build Dev APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Create Capacitor project
        run: |
          mkdir app && cd app
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/local-notifications@7
          mkdir www
          echo '<!doctype html><meta charset="utf-8"><title>Dokodemo</title>' > www/index.html
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.dokodemo.japanese.dev",
            "appName": "Dokodemo Dev",
            "webDir": "www",
            "server": { "url": "https://dokodemojapanese.github.io/index.html", "cleartext": false },
            "android": { "backgroundColor": "#FFFFFF" }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Logo and splash
        run: |
          pip install pillow
          cd app
          curl -fsSL -o icon.png https://dokodemojapanese.github.io/icon-512.png
          curl -fsSL -o mask.png https://dokodemojapanese.github.io/maskable-512.png
          cat > icons.py <<'EOF'
          import os, glob
          from PIL import Image
          R = 'android/app/src/main/res'
          ico = Image.open('icon.png').convert('RGBA')
          msk = Image.open('mask.png').convert('RGBA')
          bg = msk.getpixel((2, 2))
          D = {'mdpi': 1, 'hdpi': 1.5, 'xhdpi': 2, 'xxhdpi': 3, 'xxxhdpi': 4}
          for d, s in D.items():
              f = os.path.join(R, 'mipmap-' + d)
              os.makedirs(f, exist_ok=True)
              n = int(48 * s)
              for nm in ('ic_launcher.png', 'ic_launcher_round.png'):
                  ico.resize((n, n), Image.LANCZOS).save(os.path.join(f, nm))
              full = int(108 * s); inner = int(72 * s)
              fg = Image.new('RGBA', (full, full), (0, 0, 0, 0))
              o = (full - inner) // 2
              fg.paste(msk.resize((inner, inner), Image.LANCZOS), (o, o))
              fg.save(os.path.join(f, 'ic_launcher_foreground.png'))
          hexbg = '#%02X%02X%02X' % bg[:3]
          for p in glob.glob(R + '/values*/ic_launcher_background.xml'):
              open(p, 'w').write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + hexbg + '</color>\n</resources>\n')
          for p in glob.glob(R + '/drawable*/splash.png'):
              w, h = Image.open(p).size
              im = Image.new('RGB', (w, h), (255, 255, 255))
              n = int(min(w, h) * 0.32)
              lg = ico.resize((n, n), Image.LANCZOS)
              im.paste(lg, ((w - n) // 2, (h - n) // 2), lg)
              im.save(p)
          print('icons ok, bg', hexbg)
          EOF
          python3 icons.py

      - name: Build APK
        run: |
          cd app/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../Dokodemo-Dev.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Dokodemo-Dev-APK
          path: Dokodemo-Dev.apk
